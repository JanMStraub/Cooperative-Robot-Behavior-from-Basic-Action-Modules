# OMPL planner configs for AR4 mk3.
# Nested planner_configs blocks can't be expressed as ROS 2 launch scalars — must live here.
# /**:  applies to any namespaced move_group node (Robot1, Robot2).
/**:
  ros__parameters:
    # string_array — must come from YAML; ROS 2 launch inline dict only supports scalars
    planning_pipelines:
      - ompl

    ompl.planner_configs:
      RRTConnect:
        type: geometric::RRTConnect
        range: 0.0
      RRTstar:
        type: geometric::RRTstar
        range: 0.0
      PRM:
        type: geometric::PRM
        max_nearest_neighbors: 10
      EST:
        type: geometric::EST
        range: 0.0
        goal_bias: 0.05

    ompl.arm:
      default_planner_config: RRTConnect
      planner_configs:
        - RRTConnect
        - RRTstar
        - PRM
        - EST
      projection_evaluator: joints(joint_1, joint_2)
      longest_valid_segment_fraction: 0.05

    ompl.gripper:
      default_planner_config: RRTConnect
      planner_configs:
        - RRTConnect
